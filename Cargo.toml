[package]
name = "win-appimg"
version = "0.0.3"
authors = ["TimeRainStarSky <Time.Rain.Star.Sky@Gmail.com>"]
repository = "https://github.com/TRSSo/win-appimg"
description = "A tool for creating Windows application images"
categories = [
  "command-line-utilities",
  "development-tools::build-utils",
]
license = "LGPL-3.0"
edition = "2024"
build = "build.rs"
include = [
  "/*.toml",
  "/*.rs",
  "/*.md",
  "/LICENSE",
  "/lang",
  "/src",
]

[features]
default = ["mimalloc", "cli", "post_build"]
cli = ["dep:clap"]
depend = []
launcher = []
post_build = ["dep:sha256"]

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "depend"
path = "src/bin/depend.rs"
required-features = ["depend"]

[[bin]]
name = "launcher"
path = "src/bin/launcher.rs"
required-features = ["launcher"]

[[bin]]
name = "post_build"
path = "src/bin/post_build.rs"
required-features = ["post_build"]

[dependencies]
zerompk = { version = "0", features = ["derive"], default-features = false }
editpe = "0"
tempfile = "3"
dwarfs = "0"
dwarfs-enc = "0"
path-clean = "1"
xxhash-rust = { version = "0", features = ["xxh3"] }
fastrand = "2"
sys-locale = "0"
file-id = "0"
mimalloc = { version = "0", optional = true }
sha256 = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[build-dependencies]
yaml-rust2 = { version = "0", default-features = false }
regex = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_JobObjects",
] }
junction = "2"

[target."cfg(windows)".build-dependencies]
winresource = "0"
time = "0"
tempfile = "3"
svg_to_ico = "1"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
