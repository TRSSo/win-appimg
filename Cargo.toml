[package]
name = "win-appimg"
version = "0.0.2"
authors = ["TimeRainStarSky <Time.Rain.Star.Sky@Gmail.com>"]
repository = "https://github.com/TRSSo/win-appimg"
description = "A tool for creating Windows application images"
categories = [
  "command-line-utilities",
  "development-tools::build-utils",
]
license = "LGPL-3.0"
edition = "2024"
build = "build.rs"
include = [
  "/*.toml",
  "/*.rs",
  "/*.md",
  "/LICENSE",
  "/lang",
  "/src",
]

[features]
default = ["cli"]
cli = []
depend = []
launcher = []

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "depend"
path = "src/bin/depend.rs"
required-features = ["depend"]

[[bin]]
name = "launcher"
path = "src/bin/launcher.rs"
required-features = ["launcher"]

[dependencies]
zerompk = { version = "0", features = ["derive"] }
editpe = "0"
tempfile = "3"
dwarfs = "0"
dwarfs-enc = "0"
path-clean = "1"
xxhash-rust = { version = "0", features = ["xxh3"] }
fastrand = "2"
sha256 = "1"
clap = { version = "4", features = ["derive"] }
mimalloc = "0"
sys-locale = "0.3.2"
file-id = "0.2.3"

[build-dependencies]
yaml-rust2 = { version = "0.12.0", default-features = false }
regex = "1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_System_JobObjects",
] }
junction = "2"

[target."cfg(windows)".build-dependencies]
winresource = "0"
time = "0"
tempfile = "3"
svg_to_ico = "1"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
