About:
  - A tool for creating Windows application images
  - 一个创建 Windows 应用程序镜像的工具
LongAbout:
  - |-
      A tool for creating Windows application images
      Uses WinFsp + DwarFS, similar to AppImage
      Example: {} source.dwarfs output.exe -- app.exe
  - |-
      一个创建 Windows 应用程序镜像的工具
      使用 WinFsp + DwarFS，原理类似于 AppImage
      示例: {} source.dwarfs output.exe -- app.exe

